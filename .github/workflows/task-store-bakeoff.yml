name: Task store bakeoff

on:
  push:
    branches: [arch/best-of-all-bakeoff]
    paths:
      - "scripts/run_task_store_bakeoff.py"
      - ".github/workflows/task-store-bakeoff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-store-bakeoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verified Beads release
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/beads.tar.gz"
          curl -fsSL "https://github.com/gastownhall/beads/releases/download/v1.3.0/beads_1.3.0_linux_amd64.tar.gz" -o "$archive"
          echo "2f92b904ecf35b607e44dc5c39229173af69c54f1183e8d709f1773540cdcf3b  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/beads-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/beads-bin"
          bd_bin="$(find "$RUNNER_TEMP/beads-bin" -type f -name bd -print -quit)"
          test -n "$bd_bin"
          chmod +x "$bd_bin"
          echo "BAKEOFF_BEADS=$bd_bin" >> "$GITHUB_ENV"

      - name: Run model-free task-store benchmark
        run: python scripts/run_task_store_bakeoff.py

      - name: Publish result summary
        shell: bash
        run: |
          echo '## Model-free task-store bakeoff' >> "$GITHUB_STEP_SUMMARY"
          cat benchmarks/task-store-results.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: task-store-bakeoff
          path: benchmarks/task-store-results.json
          if-no-files-found: error
