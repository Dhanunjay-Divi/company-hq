name: Code-intelligence bake-off

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "benchmarks/code-intelligence/**"
      - ".github/workflows/code-intelligence-bakeoff.yml"
      - "graft.py"
  push:
    branches: [main, feat/best-of-all-bakeoff]
    paths:
      - "benchmarks/code-intelligence/**"
      - ".github/workflows/code-intelligence-bakeoff.yml"
      - "graft.py"

permissions:
  contents: read

concurrency:
  group: code-intelligence-bakeoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install pinned Graphify
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/graphify"
          "$RUNNER_TEMP/graphify/bin/pip" install --disable-pip-version-check             "git+https://github.com/Graphify-Labs/graphify.git@7ca736cf94cd2fe8564704e31aa0e9b9f6e04fc6"
          echo "GRAPHIFY_BIN=$RUNNER_TEMP/graphify/bin/graphify" >> "$GITHUB_ENV"

      - name: Install pinned CodeGraph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/codegraph"
          npm install --prefix "$RUNNER_TEMP/codegraph" --ignore-scripts             @colbymchenry/codegraph@1.6.0
          echo "CODEGRAPH_BIN=$RUNNER_TEMP/codegraph/node_modules/.bin/codegraph" >> "$GITHUB_ENV"

      - name: Install pinned Graft without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/graft"
          npm install --prefix "$RUNNER_TEMP/graft" --ignore-scripts             @nanonets/graft@0.18.0
          echo "COMPANY_HQ_GRAFT_INSTALL=$RUNNER_TEMP/graft" >> "$GITHUB_ENV"

      - name: Install verified Codebase Memory MCP
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/codebase-memory-mcp.tar.gz"
          root="$RUNNER_TEMP/codebase-memory-mcp"
          curl --fail --location --silent --show-error             "https://github.com/DeusData/codebase-memory-mcp/releases/download/v0.11.0/codebase-memory-mcp-linux-amd64-portable.tar.gz"             --output "$archive"
          echo "1f9e8293eb2bc5c05cfa27a7e8fc033da6d729ffad525ccfcdaa3fd606306683  $archive" | sha256sum --check -
          mkdir -p "$root"
          tar -xzf "$archive" -C "$root"
          binary="$(find "$root" -type f -name codebase-memory-mcp -perm -u+x | head -n 1)"
          test -n "$binary"
          echo "CBM_BIN=$binary" >> "$GITHUB_ENV"

      - name: Run deterministic bake-off
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/company-hq-code-intel"
          python benchmarks/code-intelligence/run.py             --work-root "$RUNNER_TEMP/company-hq-code-intel"             --output "$RUNNER_TEMP/code-intelligence-results.json"             --markdown "$RUNNER_TEMP/code-intelligence-results.md"
          cat "$RUNNER_TEMP/code-intelligence-results.md" >> "$GITHUB_STEP_SUMMARY"
          echo
          cat "$RUNNER_TEMP/code-intelligence-results.json"
