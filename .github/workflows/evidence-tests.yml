name: Evidence regression tests

on:
  pull_request:
    paths:
      - "scripts/*bakeoff*.py"
      - "tests/test_bakeoff*.py"
      - "benchmarks/evidence/**"
      - ".github/workflows/*bakeoff.yml"
      - ".github/workflows/evidence-tests.yml"
  push:
    branches: [fix/reproducible-bakeoff-evidence]
    paths:
      - "scripts/*bakeoff*.py"
      - "tests/test_bakeoff*.py"
      - ".github/workflows/evidence-tests.yml"

permissions:
  contents: read

concurrency:
  group: evidence-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p 'test_bakeoff*.py' -v
      - run: python scripts/check_source_bundle.py
