name: Token efficiency bakeoff

on:
  push:
    branches: [arch/best-of-all-bakeoff]
    paths:
      - "scripts/run_token_efficiency_bakeoff.py"
      - ".github/workflows/token-efficiency-bakeoff.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: token-efficiency-bakeoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned Headroom and pytest
        run: python -m pip install --disable-pip-version-check "headroom-ai==0.37.0" "pytest==8.4.2"

      - name: Install verified RTK release
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rtk-ai/rtk/releases/download/v0.49.0/rtk-x86_64-unknown-linux-musl.tar.gz"
          archive="$RUNNER_TEMP/rtk.tar.gz"
          curl -fsSL "$url" -o "$archive"
          echo "7278231dfd7e6a730a4ab7f847b195bcf02289c2d57622b0dab75a6411100c8f  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rtk-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/rtk-bin"
          rtk_bin="$(find "$RUNNER_TEMP/rtk-bin" -type f -name rtk -print -quit)"
          test -n "$rtk_bin"
          chmod +x "$rtk_bin"
          echo "BAKEOFF_RTK=$rtk_bin" >> "$GITHUB_ENV"

      - name: Run model-free token benchmark
        run: python scripts/run_token_efficiency_bakeoff.py

      - name: Publish result summary
        shell: bash
        run: |
          echo '## Model-free token-efficiency bakeoff' >> "$GITHUB_STEP_SUMMARY"
          cat benchmarks/token-efficiency-results.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: token-efficiency-bakeoff
          path: benchmarks/token-efficiency-results.json
          if-no-files-found: error
