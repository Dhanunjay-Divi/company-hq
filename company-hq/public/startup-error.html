<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Company HQ — startup issue</title>
<style>
  :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#17151c;color:#eee6f2}
  body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box}
  main{max-width:520px;padding:36px;border:1px solid #624f70;border-radius:22px;background:linear-gradient(145deg,#362b3d,#211d27);box-shadow:0 24px 80px #0005}
  .eyebrow{color:#c1a1d3;font-size:12px;font-weight:650;letter-spacing:.16em;text-transform:uppercase}
  h1{font-size:clamp(26px,4vw,38px);line-height:1.15;margin:18px 0}
  p{color:#d4c7db;font-size:16px;line-height:1.6;margin:0}
  .hint{border-top:1px solid #ffffff1c;margin-top:24px;padding-top:20px;color:#b6a6c1;font-size:14px}
</style></head><body><main><span class="eyebrow">Company HQ</span><h1 id="title">Could not start Company HQ</h1><p id="message">The local workspace service could not start. Quit this app and try opening it again.</p><p class="hint" id="hint">If this keeps happening, reinstall the latest Company HQ build. Your chat data is stored separately from the app.</p></main>
<script>
  if (new URLSearchParams(location.search).get('reason') === 'already-running') {
    document.title = 'Company HQ — already running';
    document.getElementById('title').textContent = 'Company HQ is already running';
    document.getElementById('message').textContent = 'Another Company HQ instance is using this workspace. Close the other instance, then reopen this app.';
    document.getElementById('hint').textContent = 'This prevents two app windows from writing to the same chats at once. Your data is safe.';
  }
</script></body></html>
